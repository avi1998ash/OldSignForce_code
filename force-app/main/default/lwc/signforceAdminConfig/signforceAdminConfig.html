<template>
    <!-- No "Customize Application" access: show a contact-admin screen, not the wizard -->
    <template if:true={accessDenied}>
        <div class="sf-denied">
            <div class="sf-denied-card">
                <svg class="sf-denied-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path fill="currentColor" d="M12 1 3 5v6c0 5.25 3.6 10.15 9 11 5.4-.85 9-5.75 9-11V5l-9-4zm0 6a2.5 2.5 0 0 1 2.5 2.5c0 .96-.54 1.79-1.33 2.21l.83 3.29h-4l.83-3.29A2.49 2.49 0 0 1 9.5 9.5 2.5 2.5 0 0 1 12 7z"/>
                </svg>
                <h1 class="sf-denied-title">Access not available</h1>
                <p class="sf-denied-text">
                    You don't have permission to open eSignforce Admin Configuration. This screen
                    needs the <strong>Customize Application</strong> administrator permission.
                </p>
                <p class="sf-denied-text">
                    Please contact your Salesforce administrator to get access or to have your
                    eSignforce setup completed.
                </p>
            </div>
        </div>
    </template>

    <div if:false={accessDenied} class="sf-wizard">
        <!-- ============ HEADER ============ -->
        <div class="sf-header">
            <div class="sf-header-left">
                <span class="sf-brand">ESIGNFORCE</span>
                <h1 class="sf-title">Admin Configuration</h1>
            </div>
            <div class="sf-progress-badge">{progressLabel}</div>
        </div>

        <!-- ============ STEP INDICATOR ============ -->
        <div class={stepsClass}>
            <template for:each={stepItems} for:item="s">
                <div key={s.num} class={s.cls} data-step={s.num}
                    role="button" tabindex="0"
                    onclick={handleStepClick} onkeydown={handleStepKey}>
                    <div class="sf-step-circle">
                        <template if:true={s.isDone}>
                            <lightning-icon icon-name="utility:check" size="xx-small"
                                variant="inverse" class="sf-step-check"></lightning-icon>
                        </template>
                        <template if:false={s.isDone}>{s.num}</template>
                    </div>
                    <div class="sf-step-label">{s.label}</div>
                </div>
            </template>
        </div>

        <!-- ============ CARD ============ -->
        <div class="sf-card">
            <template if:true={loading}>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>

            <template if:false={loading}>
                <!-- ---------- STEP 1: SITE ---------- -->
                <template if:true={isStep1}>
                    <p class="sf-eyebrow">STEP 01</p>
                    <h2 class="sf-heading">Signing Site</h2>
                    <p class="sf-desc">
                        Point eSignforce at your Experience Cloud signing site. Signing links are built as <code>{reviewSiteUrl}/signature?token=…</code>
                    </p>

                    <template if:true={hasSites}>
                        <lightning-combobox
                            label="Detected sites"
                            placeholder="Select to auto-fill the URL"
                            options={siteOptions}
                            value={signingSiteBaseUrl}
                            onchange={handleSiteSelect}
                            class="slds-m-bottom_small"
                            field-level-help="Experience sites found in this org.">
                        </lightning-combobox>
                    </template>

                    <lightning-input
                        type="url"
                        label="Signing Site Base URL"
                        value={signingSiteBaseUrl}
                        onchange={handleUrlChange}
                        placeholder="https://acme.my.site.com/sign"
                        field-level-help="Domain + path prefix. Used to build signing links.">
                    </lightning-input>

                    <div class="slds-m-top_small">
                        <lightning-button
                            label="Detect sites again"
                            icon-name="utility:refresh"
                            onclick={handleRefreshSites}>
                        </lightning-button>
                    </div>

                    <!-- Verify the /signature page exists on the selected site -->
                    <template if:true={hasSelectedSite}>
                        <div class="sf-verify">
                            <p class="sf-verify-title">
                                <lightning-icon icon-name="utility:page" size="xx-small"
                                    class="slds-m-right_xx-small"></lightning-icon>
                                Check the <code>/signature</code> page
                            </p>
                            <p class="sf-verify-text">
                                Open the signing page to confirm it exists. You should see the eSignforce signing screen (an &ldquo;invalid link&rdquo; message for a missing token is normal - it means the page is live). If you get <b>Page Not Found</b>, the <code>signature</code> page hasn't been added yet - <button class="sf-link" onclick={showSetup}>add it (setup steps)</button>.
                            </p>
                            <button class="sf-btn sf-btn_secondary sf-verify-btn" onclick={openSignaturePage} type="button">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sf-verify-btn-icon">
                                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                                    <polyline points="15 3 21 3 21 9"></polyline>
                                    <line x1="10" y1="14" x2="21" y2="3"></line>
                                </svg>
                                <span>Open /signature page</span>
                            </button>
                        </div>
                    </template>

                    <!-- No site? Set one up -->
                    <div class="sf-scriptgen">
                        <button class="sf-link" onclick={toggleScriptGen}>
                            <lightning-icon icon-name="utility:setup" size="xx-small"
                                class="slds-m-right_xx-small"></lightning-icon>
                            No site yet? Set one up
                        </button>

                        <template if:true={showScriptGen}>
                            <div class="sf-setup">
                                <div class="sf-setup-intro">
                                    <lightning-icon icon-name="utility:info_alt" size="x-small"
                                        variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                                    <span>Salesforce can't create an Experience site from Apex - so pick a path. Both end with the same working signing site.</span>
                                </div>

                                <div class="sf-opt-tabs">
                                    <button class="sf-opt-tab sf-opt-tab_btn" onclick={openManualModal}>
                                        Option A &middot; Manual steps (no CLI) &rarr;
                                    </button>
                                    <button class="sf-opt-tab sf-opt-tab_btn" onclick={openCliModal}>
                                        Option B &middot; CLI command (fastest) &rarr;
                                    </button>
                                </div>

                                <p class="sf-setup-help slds-m-top_small">
                                    Pick a path above - each opens step-by-step instructions. Both end with the same working signing site.
                                </p>

                                <p class="sf-url-hint">
                                    <lightning-icon icon-name="utility:link" size="xx-small"
                                        class="slds-m-right_xx-small"></lightning-icon>
                                    Your signing page will be <code>{sitePreviewUrl}/signature</code>
                                </p>
                            </div>
                        </template>
                    </div>

                    <!-- ===== Manual steps modal (Option A) ===== -->
                    <template if:true={showManualModal}>
                        <section role="dialog" tabindex="-1" aria-modal="true"
                            aria-labelledby="sf-manual-title" class="slds-modal slds-fade-in-open sf-modal">
                            <div class="slds-modal__container sf-modal__container">
                                <header class="slds-modal__header sf-modal-head">
                                    <button class="sf-modal-close" title="Close"
                                        onclick={closeManualModal}>&times;</button>
                                    <p class="sf-modal-eyebrow">ESIGNFORCE &middot; MANUAL SETUP</p>
                                    <h2 id="sf-manual-title" class="sf-modal-title">
                                        Create the signing site manually (no CLI)
                                    </h2>
                                    <p class="sf-modal-sub">
                                        Three steps in Setup &amp; Experience Builder - ends with the same working signing site.
                                    </p>
                                </header>

                                <div class="slds-modal__content sf-modal-body">
                                    <ol class="sf-doc">
                                        <li class="sf-doc-step">
                                            <span class="sf-doc-num">1</span>
                                            <div class="sf-doc-text">
                                                <p class="sf-doc-title">Create the site</p>
                                                <ul>
                                                    <li>Setup &rarr; <b>Digital Experiences</b> &rarr; <b>All Sites</b> &rarr; <b>New</b>.</li>
                                                    <!-- One line: a break after </code> would render
                                                         "eSignforce Portal&middot;" with no space. -->
                                                    <li>Template <b>Build Your Own (LWR)</b> &middot; Name <code>eSignforce Portal</code> &middot; URL <code>sign</code> &rarr; <b>Create</b>.</li>
                                                    <li style="color:#94a3b8;">First time only: if prompted, enable Digital
                                                        Experiences in Settings, then come back.</li>
                                                </ul>
                                            </div>
                                        </li>

                                        <li class="sf-doc-step">
                                            <span class="sf-doc-num">2</span>
                                            <div class="sf-doc-text">
                                                <p class="sf-doc-title">Add the signing page &amp; publish</p>
                                                <ul>
                                                    <li>Open <b>Builder</b> &rarr; <b>New Page</b> &rarr; route <code>signature</code>.</li>
                                                    <li>Drag the <b>eSignforce signing component</b> (signingViewer) onto the page &rarr; <b>Save</b>.</li>
                                                    <li><b>Publish</b> (top-right), then <b>Activate</b> the site.</li>
                                                </ul>
                                            </div>
                                        </li>

                                        <li class="sf-doc-step">
                                            <span class="sf-doc-num">3</span>
                                            <div class="sf-doc-text">
                                                <p class="sf-doc-title">Grant Guest User access <span class="sf-doc-tag sf-doc-tag_warn">required</span></p>
                                                <ul>
                                                    <!-- One line: a break after </b> would render
                                                         "Guest User Access&rarr;" with no space. -->
                                                    <li>Setup &rarr; <b>Permission Sets</b> &rarr; <b>eSignforce Guest User Access</b> &rarr; <b>Manage Assignments</b> &rarr; add the site's Guest User (<i>&lt;Site&gt; Site Guest User</i>).</li>
                                                </ul>
                                            </div>
                                        </li>
                                    </ol>

                                    <div class="sf-doc-callout">
                                        <lightning-icon icon-name="utility:success" size="x-small"
                                            class="sf-doc-callout-icon slds-m-right_x-small"></lightning-icon>
                                        <span class="sf-doc-callout-text">Done! Your site now appears in <b>Detected sites</b> above. Pick it and <b>Save</b>. Signing URL: <code>{sitePreviewUrl}/signature</code></span>
                                    </div>

                                    <p class="sf-url-hint">
                                        <lightning-icon icon-name="utility:link" size="xx-small"
                                            class="slds-m-right_xx-small"></lightning-icon>
                                        Your signing page will be <code>{sitePreviewUrl}/signature</code>
                                    </p>
                                </div>

                                <footer class="slds-modal__footer">
                                    <button class="sf-btn sf-btn_secondary" onclick={closeManualModal}>Close</button>
                                    <button class="sf-btn sf-btn_primary" onclick={closeManualModal}>Got it</button>
                                </footer>
                            </div>
                        </section>
                        <div class="slds-backdrop slds-backdrop_open"></div>
                    </template>

                    <!-- ===== CLI command modal (Option B) ===== -->
                    <template if:true={showCliModal}>
                        <section role="dialog" tabindex="-1" aria-modal="true"
                            aria-labelledby="sf-cli-title" class="slds-modal slds-fade-in-open sf-modal">
                            <div class="slds-modal__container sf-modal__container">
                                <header class="slds-modal__header sf-modal-head">
                                    <button class="sf-modal-close" title="Close"
                                        onclick={closeCliModal}>&times;</button>
                                    <p class="sf-modal-eyebrow">ESIGNFORCE &middot; CLI SETUP</p>
                                    <h2 id="sf-cli-title" class="sf-modal-title">
                                        Create the signing site with the CLI
                                    </h2>
                                    <p class="sf-modal-sub">
                                        One command in your project folder, then publish in Builder - the fastest path.
                                    </p>
                                </header>

                                <div class="slds-modal__content sf-modal-body">
                                    <div class="slds-grid slds-wrap slds-gutters">
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                            <lightning-input
                                                label="Site name"
                                                value={scriptSiteName}
                                                onchange={handleScriptNameChange}>
                                            </lightning-input>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                            <lightning-input
                                                label="URL path prefix"
                                                value={scriptPrefix}
                                                onchange={handleScriptPrefixChange}
                                                field-level-help="The path segment after the domain, e.g. 'sign'.">
                                            </lightning-input>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                            <lightning-combobox
                                                label="Template"
                                                options={templateOptions}
                                                value={scriptTemplate}
                                                onchange={handleScriptTemplateChange}>
                                            </lightning-combobox>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                            <lightning-input
                                                label="Org alias / username"
                                                value={scriptOrgAlias}
                                                onchange={handleScriptAliasChange}
                                                placeholder="my-org-alias"
                                                field-level-help="Your Salesforce CLI alias or username for this org.">
                                            </lightning-input>
                                        </div>
                                    </div>

                                    <!-- Step 1: the command -->
                                    <div class="sf-step-card">
                                        <div class="sf-step-card-head">
                                            <span class="sf-num">1</span>
                                            <span>Create the site - run this in your project folder</span>
                                        </div>
                                        <div class="sf-terminal">
                                            <div class="sf-terminal-bar">
                                                <span class="sf-dot sf-dot_r"></span>
                                                <span class="sf-dot sf-dot_y"></span>
                                                <span class="sf-dot sf-dot_g"></span>
                                                <span class="sf-terminal-title">Terminal &middot; Salesforce CLI</span>
                                                <button class="sf-copy-btn" onclick={copyScript} title="Copy command">
                                                    <lightning-icon icon-name="utility:copy" size="xx-small"
                                                        variant="inverse"></lightning-icon>
                                                    <span class="slds-m-left_xx-small">Copy</span>
                                                </button>
                                            </div>
                                            <pre class="sf-script">{generatedScript}</pre>
                                        </div>

                                        <p class="sf-flag-caption">What each part does</p>
                                        <table class="sf-flag-table">
                                            <tbody>
                                                <tr>
                                                    <td><code>sf community create</code></td>
                                                    <td>Creates a new Experience (Digital Experience) site.</td>
                                                </tr>
                                                <tr>
                                                    <td><code>--name</code></td>
                                                    <td>The site's display name (shown in Setup).</td>
                                                </tr>
                                                <tr>
                                                    <td><code>--template-name</code></td>
                                                    <td>Uses the blank <b>Build Your Own (LWR)</b> template -
                                                        required for the signing component.</td>
                                                </tr>
                                                <tr>
                                                    <td><code>--url-path-prefix</code></td>
                                                    <td>The URL segment after your domain (&rarr; <code>/{scriptPrefix}</code>).</td>
                                                </tr>
                                                <tr>
                                                    <td><code>--target-org</code></td>
                                                    <td>Your CLI org alias or username - where the site is created.</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>

                                    <!-- Step 2: Experience Builder -->
                                    <div class="sf-step-card">
                                        <div class="sf-step-card-head">
                                            <span class="sf-num">2</span>
                                            <span>Then, in Experience Builder</span>
                                        </div>
                                        <ul class="sf-eb-list">
                                            <li>Add a page at route <code>/signature</code> and drop the <b>signingViewer</b> component on it.</li>
                                            <li><b>Publish</b>, then <b>Activate</b> the site.</li>
                                            <li>Assign <i>eSignforce Guest User Access</i> to the site's Guest User
                                                (see the Permissions step).</li>
                                        </ul>
                                    </div>

                                    <p class="sf-url-hint">
                                        <lightning-icon icon-name="utility:link" size="xx-small"
                                            class="slds-m-right_xx-small"></lightning-icon>
                                        Your signing page will be <code>{sitePreviewUrl}/signature</code>
                                    </p>
                                </div>

                                <footer class="slds-modal__footer">
                                    <button class="sf-btn sf-btn_secondary" onclick={closeCliModal}>Close</button>
                                    <button class="sf-btn sf-btn_primary" onclick={closeCliModal}>Got it</button>
                                </footer>
                            </div>
                        </section>
                        <div class="slds-backdrop slds-backdrop_open"></div>
                    </template>
                </template>

                <!-- ---------- STEP 2: CONFIG ---------- -->
                <template if:true={isStep2}>
                    <p class="sf-eyebrow">STEP 02</p>
                    <h2 class="sf-heading">Sender Email Settings</h2>
                    <p class="sf-desc">Choose which address signature emails are sent from.</p>

                    <div class="sf-sender-cards" role="radiogroup" aria-label="Send emails from">
                        <!-- Org-wide. The address picker sits inside this card so it
                             reads as part of the choice, not a separate setting. -->
                        <div class={orgWideCardClass} role="radio" tabindex="0"
                             aria-checked={sendsAsOrgWideStr}
                             data-mode="OrgWide"
                             onclick={handleSenderCardSelect}
                             onkeydown={handleSenderCardKey}>
                            <div class="sf-sender-card-top">
                                <span class="sf-sender-dot"></span>
                                <span class="sf-sender-title">A verified org-wide address</span>
                            </div>
                            <p class="sf-sender-note">Every email comes from one company address.</p>
                            <div class="sf-sender-picker" onclick={stopCardClick}>
                                <lightning-combobox
                                    label="Org-wide address"
                                    variant="label-hidden"
                                    placeholder="Auto-detect"
                                    options={owaOptions}
                                    value={orgWideEmailId}
                                    onchange={handleOwaChange}>
                                </lightning-combobox>
                            </div>
                        </div>

                        <!-- Send as the sender. -->
                        <div class={currentUserCardClass} role="radio" tabindex="0"
                             aria-checked={sendsAsCurrentUserStr}
                             data-mode="CurrentUser"
                             onclick={handleSenderCardSelect}
                             onkeydown={handleSenderCardKey}>
                            <div class="sf-sender-card-top">
                                <span class="sf-sender-dot"></span>
                                <span class="sf-sender-title">The user who sends it</span>
                            </div>
                            <p class="sf-sender-note">Replies go straight to that person.</p>
                            <div class="sf-sender-from">
                                From: <span>{currentUserFrom}</span>
                            </div>
                        </div>
                    </div>

                    <p class="sf-sender-foot">
                        Completion emails always use the org-wide address - a signing session
                        has no Salesforce user behind it.
                    </p>

                    <template if:true={showOwaWarning}>
                        <div class="sf-storage-warning" role="status">
                            <svg class="sf-storage-warning-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>
                            </svg>
                            <div class="sf-storage-warning-body">
                                <p class="sf-storage-warning-title">No org-wide address selected</p>
                                <p class="sf-storage-warning-text">
                                    eSignforce will <strong>auto-detect</strong> a verified address. Pick one
                                    above for a consistent sender on completion emails.
                                </p>
                            </div>
                        </div>
                    </template>
                </template>

                <!-- ---------- STEP 3: INTERNAL USERS ---------- -->
                <template if:true={isStep3}>
                    <p class="sf-eyebrow">STEP 03</p>
                    <h2 class="sf-heading">Internal Users</h2>
                    <p class="sf-desc">
                        Pick a tab &mdash; <b>Admin</b>, <b>Standard</b> or <b>Community</b> &mdash; then move users to <b>Assigned</b> and click <b>Apply changes</b>. Admin and Standard access also assigns a licence seat automatically; if no seats remain, the assignment is refused.
                    </p>

                    <template if:true={showNoAssignmentWarning}>
                        <div class="sf-storage-warning" role="status">
                            <svg class="sf-storage-warning-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>
                            </svg>
                            <div class="sf-storage-warning-body">
                                <p class="sf-storage-warning-title">No users assigned yet</p>
                                <p class="sf-storage-warning-text">No user is assigned to this permission set, so <strong>they can't use eSignforce yet.</strong> Move at least one user to <strong>Assigned</strong> and click <strong>Apply changes</strong> to grant access.</p>
                            </div>
                        </div>
                    </template>
                </template>

                <!-- ---------- STEP 4: GUEST USERS ---------- -->
                <template if:true={isStep4}>
                    <p class="sf-eyebrow">STEP 04</p>
                    <h2 class="sf-heading">Guest Users</h2>
                    <p class="sf-desc">
                        Assign your Experience site&rsquo;s <b>Guest User</b> so external signers can open signing links. Move the Guest User to <b>Assigned</b> and click <b>Apply changes</b>.
                    </p>

                    <template if:true={hasGuestPermSets}>
                        <template if:true={showNoGuestAssignmentWarning}>
                            <div class="sf-storage-warning" role="status">
                                <svg class="sf-storage-warning-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                    <circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>
                                </svg>
                                <div class="sf-storage-warning-body">
                                    <p class="sf-storage-warning-title">No Guest User assigned</p>
                                    <p class="sf-storage-warning-text">Your Experience site&rsquo;s Guest User isn&rsquo;t assigned this permission set, so <strong>external signers can&rsquo;t open signing links.</strong> Move the Guest User to <strong>Assigned</strong> and click <strong>Apply changes</strong> to enable signing.</p>
                                </div>
                            </div>
                        </template>
                    </template>
                </template>

                <!-- Shared permission-set picker for the Internal & Guest steps -->
                <template if:true={isPermStep}>
                    <template if:true={hasVisiblePermSets}>
                        <!-- Internal step: role tabs decide permission set + user list.
                             Admin and Standard consume a licence seat; Community does not. -->
                        <template if:true={isStep3}>
                            <div class="slds-m-bottom_small sf-role-tabs">
                                <lightning-button-group>
                                    <template for:each={roleTabs} for:item="t">
                                        <lightning-button key={t.key} label={t.label} variant={t.variant}
                                            data-role={t.key} onclick={handleRoleSelect}></lightning-button>
                                    </template>
                                </lightning-button-group>
                                <lightning-badge class="slds-m-left_small" label={assignedSummary}></lightning-badge>
                            </div>
                        </template>
                        <template if:true={isStep4}>
                            <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_small">
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <lightning-combobox
                                        label="Permission set"
                                        options={visiblePermSetOptions}
                                        value={selectedPermSet}
                                        onchange={handlePermSetChange}>
                                    </lightning-combobox>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-align-bottom">
                                    <lightning-badge label={assignedSummary}></lightning-badge>
                                </div>
                            </div>
                        </template>

                        <template if:true={hasUsers}>
                            <template if:true={isLargeUserList}>
                                <div class="slds-box slds-box_xx-small slds-theme_warning slds-m-bottom_x-small slds-text-body_small">
                                    Large org - the picker may be slow. Use "Select all" for a full rollout.
                                </div>
                            </template>

                            <lightning-dual-listbox
                                name="userAssignment"
                                label="Users"
                                source-label="Available (not assigned)"
                                selected-label="Assigned"
                                options={userOptions}
                                value={assignedUserIds}
                                onchange={handleUsersChange}
                                field-level-help="Move users right to assign, left to remove.">
                            </lightning-dual-listbox>

                            <div class="slds-m-top_small sf-perm-actions">
                                <lightning-button-group>
                                    <lightning-button label="Select all" icon-name="utility:right"
                                        onclick={handleSelectAll}></lightning-button>
                                    <lightning-button label="Clear all" icon-name="utility:left"
                                        onclick={handleClearAll}></lightning-button>
                                </lightning-button-group>
                                <lightning-button class="slds-m-left_small" label="Apply changes"
                                    variant="brand" onclick={handleApplyAssignments}
                                    disabled={applying}></lightning-button>
                                <template if:true={applying}>
                                    <lightning-spinner alternative-text="Applying" size="small"></lightning-spinner>
                                </template>
                            </div>

                            <template if:true={hasFailures}>
                                <div class="slds-box slds-box_x-small slds-theme_error slds-m-top_small">
                                    <p class="slds-text-title_caps slds-m-bottom_xx-small">Some changes failed</p>
                                    <ul class="slds-list_dotted slds-text-body_small">
                                        <template for:each={failures} for:item="f">
                                            <li key={f}>{f}</li>
                                        </template>
                                    </ul>
                                </div>
                            </template>
                        </template>

                        <template if:false={hasUsers}>
                            <p class="slds-text-color_weak">{noUsersText}</p>
                        </template>
                    </template>

                    <template if:false={hasVisiblePermSets}>
                        <p class="slds-text-color_weak">{noPermSetText}</p>
                    </template>
                </template>

                <!-- ---------- STEP 5: INTEGRATIONS ---------- -->
                <template if:true={isStep5}>
                    <p class="sf-eyebrow">STEP 05</p>
                    <h2 class="sf-heading">Cloud Integrations</h2>
                    <p class="sf-desc">Configure external cloud storage providers to automatically push completed agreements.</p>

                    <template if:true={noCloudConnected}>
                        <div class="sf-storage-warning" role="status">
                            <svg class="sf-storage-warning-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>
                            </svg>
                            <div class="sf-storage-warning-body">
                                <p class="sf-storage-warning-title">Using Salesforce storage</p>
                                <p class="sf-storage-warning-text">
                                    No cloud storage is connected, so completed agreements are saved to Salesforce Files
                                    and count against your org's file storage. <strong>Documents larger than 4 MB can't
                                    be uploaded.</strong> Connect Google Drive or OneDrive below to store documents there
                                    instead and lift this limit.
                                </p>
                            </div>
                        </div>
                    </template>

                    <c-cloud-integration-card
                        provider="GoogleDrive"
                        label="Google Drive"
                        logo-url={driveLogoUrl}
                        help-text="Automatically upload the signed PDF, original document and certificate to Google Drive when an agreement completes."
                        enabled={integrationGoogleDriveEnabled}
                        target={integrationGoogleDriveTarget}
                        target-name={integrationGoogleDriveTargetName}
                        onconfigchange={handleIntegrationConfigChange}>
                    </c-cloud-integration-card>

                    <c-cloud-integration-card
                        provider="OneDrive"
                        label="OneDrive"
                        logo-url={oneDriveLogoUrl}
                        help-text="Automatically upload the signed PDF, original document and certificate to OneDrive when an agreement completes."
                        enabled={integrationOneDriveEnabled}
                        target={integrationOneDriveTarget}
                        target-name={integrationOneDriveTargetName}
                        onconfigchange={handleIntegrationConfigChange}>
                    </c-cloud-integration-card>
                </template>

                <!-- ---------- STEP 6: REVIEW ---------- -->
                <template if:true={isStep6}>
                    <p class="sf-eyebrow">STEP 06</p>
                    <h2 class="sf-heading">Review &amp; Save</h2>
                    <p class="sf-desc">Confirm your configuration, then save. Permission set assignments are applied in the Internal Users and Guest Users steps.</p>

                    <dl class="sf-review">
                        <div class="sf-review-row">
                            <dt>Signing Site URL</dt><dd>{reviewSiteUrl}</dd>
                        </div>
                        <div class="sf-review-row">
                            <dt>Emails sent from</dt><dd>{reviewSenderAddress}</dd>
                        </div>
                        <div class="sf-review-row">
                            <dt>Google Drive Push</dt><dd>{reviewGoogleDrive}</dd>
                        </div>
                        <div class="sf-review-row">
                            <dt>OneDrive Push</dt><dd>{reviewOneDrive}</dd>
                        </div>
                    </dl>

                    <template if:true={hasReviewPermSets}>
                        <p class="sf-review-subhead">Permission sets</p>
                        <ul class="sf-perm-review">
                            <template for:each={reviewPermSets} for:item="ps">
                                <li key={ps.key} class="sf-perm-review-row">
                                    <div class="sf-perm-review-main">
                                        <span class="sf-perm-review-label">{ps.label}</span>
                                        <template if:true={ps.users}>
                                            <span class="sf-perm-review-users">{ps.users}</span>
                                        </template>
                                    </div>
                                    <span class={ps.pillClass}>{ps.statusText}</span>
                                </li>
                            </template>
                        </ul>
                    </template>
                </template>
                </template>

                <!-- Inline required-fields warning, raised on Continue -->
                <template if:true={stepError}>
                    <div class="sf-step-error" role="alert">
                        <svg class="sf-step-error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <path d="M10.3 3.9 1.9 18a2 2 0 0 0 1.7 3h16.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>
                        </svg>
                        <span>{stepError}</span>
                    </div>
                </template>
            </div>

        <!-- ============ FOOTER NAV ============ -->
        <div class="sf-footer">
            <!-- Editing: normal navigation + Save. -->
            <template if:false={locked}>
                <template if:true={canGoBack}>
                    <button class="sf-btn sf-btn_secondary" onclick={handleBack}>← Back</button>
                </template>
                <div class="sf-footer-spacer"></div>
                <template if:true={canGoNext}>
                    <button class="sf-btn sf-btn_primary" onclick={handleNext}>Continue →</button>
                </template>
                <template if:true={isLastStep}>
                    <button class="sf-btn sf-btn_primary" onclick={handleSave} disabled={saving}>
                        Save configuration
                    </button>
                </template>
            </template>
            <!-- Locked (after save): read-only, only Edit re-enables the wizard. -->
            <template if:true={locked}>
                <div class="sf-footer-spacer"></div>
                <button class="sf-btn sf-btn_primary" onclick={handleEdit}>Edit</button>
            </template>
        </div>

        <!-- Themed confirm/prompt, in place of the SLDS + native dialogs -->
        <c-signforce-confirm></c-signforce-confirm>
    </div>
</template>
