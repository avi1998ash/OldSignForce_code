<!--
  @description       : SignForce Signer Manager LWC template
  @author            : Antigravity Redesign
  @last modified on  : 05-21-2026
-->
<template>
    <c-signforce-access-gate>
        <div class="sf-shell">
            <!-- ── HEADER ──────────────────────────────────────────────── -->
            <div class="sf-header">
                <div class="sf-brand">
                    <div class="sf-brand-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                    </div>
                    <div class="sf-brand-text">
                        <p class="sf-brand-eyebrow">eSignforce</p>
                        <div class="sf-brand-title-wrap">
                            <h2 class="sf-brand-title">Signers</h2>
                            <template if:true={signerRows.length}>
                                <span class="sf-count-badge">{signerRows.length}</span>
                            </template>
                        </div>
                    </div>
                </div>

                <div class="sf-header-actions">
                    <template if:true={canRemindAll}>
                        <button class="sf-icon-btn-header sf-btn-remind-all" onclick={handleRemindAll} title="Remind All">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                            </svg>
                        </button>
                    </template>
                    <template if:true={canVoid}>
                        <button class="sf-icon-btn-header sf-btn-void-all" onclick={handleVoid} title="Void Agreement">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                            </svg>
                        </button>
                    </template>
                    <!--
                        "Save as Template" is hidden until the other half of the
                        feature exists. The button works: it creates an Agreement
                        with Is_Template__c = true and copies the signers and the
                        signature fields onto it. Nothing can consume that record.
                        AgreementController.getTemplates() is there to read them
                        back, but no LWC, Aura component or flow calls it, so a
                        saved template can never be applied to a new agreement.

                        Showing it means a user saves a template, sees a success
                        toast, and then finds no way to use it. Re-enable this
                        block once Create Agreement has a "start from template"
                        picker wired to getTemplates(). The Apex, the handler and
                        the canSaveTemplate getter are all left in place.

                    <template if:true={canSaveTemplate}>
                        <button class="sf-icon-btn-header sf-btn-template-all" onclick={handleSaveAsTemplate} title="Save as Template">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="3" y1="9" x2="21" y2="9"></line>
                                <line x1="9" y1="21" x2="9" y2="9"></line>
                            </svg>
                        </button>
                    </template>
                    -->
                    <template if:true={canEdit}>
                        <button class="sf-row-btn sf-row-btn-primary sf-btn-add" onclick={handleShowAdd}>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="sf-row-btn-icon">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            <span>Add</span>
                        </button>
                    </template>
                </div>
            </div>

            <!-- ── LOADING ────────────────────────────────────────────── -->
            <template if:true={isLoading}>
                <div class="sf-state">
                    <div class="sf-spinner"></div>
                    <p class="sf-state-text">Loading signers…</p>
                </div>
            </template>

            <!-- ── SIGNERS LIST ───────────────────────────────────────── -->
            <template if:false={isLoading}>
                <template if:true={signerRows.length}>
                    <div class="sf-signer-list">
                        <template for:each={signerRows} for:item="signer">
                            <div key={signer.Id} class="sf-signer-card">
                                <div class="sf-signer-left">
                                    <div class="sf-avatar" style={signer.avatarStyle}>
                                        {signer.initials}
                                    </div>
                                    <div class="sf-signer-info">
                                        <p class="sf-signer-name" title={signer.Name}>{signer.Name}</p>
                                        <p class="sf-signer-email" title={signer.Email__c}>{signer.Email__c}</p>
                                        <div class="sf-signer-meta">
                                            <span class={signer.statusClass}>{signer.Status__c}</span>
                                            <span class="sf-role">{signer.Role__c}</span>
                                            <span class="sf-order">Order: {signer.Signing_Order__c}</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="sf-signer-right">
                                    <template if:true={signer.isSigned}>
                                        <span class="sf-signed-date">{signer.signedDateFormatted}</span>
                                    </template>
                                    <div class="sf-signer-actions">
                                        <template if:true={signer.canResend}>
                                            <button class="sf-action-btn sf-icon-inperson" data-id={signer.Id} onclick={handleInPersonSign} title="In-Person Signing">
                                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                                                    <line x1="8" y1="21" x2="16" y2="21"></line>
                                                    <line x1="12" y1="17" x2="12" y2="21"></line>
                                                </svg>
                                            </button>
                                        </template>
                                        <template if:true={signer.canRemind}>
                                            <button class="sf-action-btn sf-icon-remind" data-id={signer.Id} onclick={handleRemind} title="Send Reminder">
                                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                                                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                                                </svg>
                                            </button>
                                        </template>
                                        <template if:true={signer.canResend}>
                                            <button class="sf-action-btn sf-icon-resend" data-id={signer.Id} onclick={handleResend} title="Resend Email">
                                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                    <line x1="22" y1="2" x2="11" y2="13"></line>
                                                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                                </svg>
                                            </button>
                                        </template>
                                        <template if:true={canEdit}>
                                            <button class="sf-action-btn sf-icon-edit" data-id={signer.Id} onclick={handleEdit} title="Edit">
                                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                                </svg>
                                            </button>
                                            <button class="sf-action-btn sf-icon-delete" data-id={signer.Id} onclick={handleDelete} title="Delete">
                                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                    <polyline points="3 6 5 6 21 6"></polyline>
                                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                                </svg>
                                            </button>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- ── CC-ONLY RECIPIENTS (BUG-041) ───────────────────────── -->
                <!-- CC recipients are kept visible/manageable here but OUT of the
                     signing grid: no Resend/Remind/In-Person actions, only edit/delete. -->
                <template if:true={ccRows.length}>
                    <div class="sf-signer-list sf-cc-list">
                        <p class="sf-cc-section-label">CC Recipients</p>
                        <template for:each={ccRows} for:item="signer">
                            <div key={signer.Id} class="sf-signer-card sf-cc-card">
                                <div class="sf-signer-left">
                                    <div class="sf-avatar" style={signer.avatarStyle}>
                                        {signer.initials}
                                    </div>
                                    <div class="sf-signer-info">
                                        <p class="sf-signer-name" title={signer.Name}>{signer.Name}</p>
                                        <p class="sf-signer-email" title={signer.Email__c}>{signer.Email__c}</p>
                                        <div class="sf-signer-meta">
                                            <span class="sf-role">CC Only</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="sf-signer-right">
                                    <div class="sf-signer-actions">
                                        <template if:true={canEdit}>
                                            <button class="sf-action-btn sf-icon-edit" data-id={signer.Id} onclick={handleEdit} title="Edit">
                                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                                </svg>
                                            </button>
                                            <button class="sf-action-btn sf-icon-delete" data-id={signer.Id} onclick={handleDelete} title="Delete">
                                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                    <polyline points="3 6 5 6 21 6"></polyline>
                                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                                </svg>
                                            </button>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- ── EMPTY STATE ────────────────────────────────────────── -->
                <template if:false={signers.length}>
                    <div class="sf-state">
                        <div class="sf-state-icon-wrap">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="sf-state-icon">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <line x1="19" y1="8" x2="19" y2="14"></line>
                                <line x1="22" y1="11" x2="16" y2="11"></line>
                            </svg>
                        </div>
                        <h3 class="sf-state-title">No signers added yet</h3>
                        <p class="sf-state-body">Add contacts or team members who need to sign or approve this agreement.</p>
                        <template if:true={canEdit}>
                            <button class="sf-row-btn sf-row-btn-primary sf-btn-add-empty" onclick={handleShowAdd} style="margin-top: 16px;">
                                Add First Signer
                            </button>
                        </template>
                    </div>
                </template>
            </template>

            <!-- ── ADD/EDIT MODAL ─────────────────────────────────────── -->
            <template if:true={showModal}>
                <!-- Modal backdrop no longer closes on click - user must
                     explicitly click Close (X) or Cancel. Prevents accidental
                     dismissal of half-filled signer forms. -->
                <section class="sf-modal-backdrop">
                    <div class="sf-modal-dialog">
                        <header class="sf-modal-header">
                            <div class="sf-modal-icon-info">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="9" cy="7" r="4"></circle>
                                </svg>
                            </div>
                            <div class="sf-modal-title-block">
                                <p class="sf-modal-eyebrow">eSignforce SIGNER</p>
                                <h3 class="sf-modal-title">{modalTitle}</h3>
                            </div>
                            <button class="sf-modal-close" onclick={handleCloseModal} title="Close">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </button>
                        </header>

                        <div class="sf-modal-body">
                            <!-- Existing signer search suggestions -->
                            <div class="sf-form-row sf-search-wrap">
                                <lightning-input type="search" label="Use existing signer (search by name or email)" value={searchTerm} onchange={handleSearchChange}
                                    onfocus={handleSearchFocus} onblur={handleSearchBlur} placeholder="Type to find past signers, contacts, or leads…" variant="label-stacked"
                                    class="sf-input">
                                </lightning-input>
                                <template if:true={showSuggestions}>
                                    <!-- Same blur-then-re-render trap as createAgreement: without
                                         swallowing mousedown the click never reaches the item. -->
                                    <div class="sf-suggestions" onmousedown={handleSuggestionMouseDown}>
                                        <template for:each={suggestions} for:item="sg" for:index="sidx">
                                            <div key={sg.email} class="sf-suggestion-item" data-sidx={sidx} onclick={handleSuggestionClick}>
                                                <div class="sf-suggestion-main">
                                                    <p class="sf-suggestion-name">{sg.name}</p>
                                                    <p class="sf-suggestion-email">{sg.email}</p>
                                                </div>
                                                <span class="sf-suggestion-source">{sg.source}</span>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>

                            <div class="sf-form-row">
                                <lightning-input label="Full Name" value={formName} onchange={handleFormName} required variant="label-stacked" placeholder="Jane Doe"
                                    class="sf-input"></lightning-input>
                            </div>
                            <div class="sf-form-row">
                                <lightning-input type="email" label="Email" value={formEmail} onchange={handleFormEmail} required variant="label-stacked" placeholder="jane@company.com"
                                    class="sf-input"></lightning-input>
                            </div>
                            <div class="sf-form-grid">
                                <lightning-combobox label="Role" value={formRole} options={roleOptions} onchange={handleFormRole} variant="label-stacked"
                                    class="sf-input"></lightning-combobox>
                                <lightning-input type="number" label="Signing Order" value={formOrder} onchange={handleFormOrder} variant="label-stacked" min="1"
                                    class="sf-input"></lightning-input>
                            </div>
                        </div>

                        <div class="sf-modal-footer">
                            <button class="sf-btn sf-btn-ghost" onclick={handleCloseModal}>Cancel</button>
                            <button class="sf-btn sf-btn-primary" onclick={handleSave} disabled={isSaving}>
                                <template if:true={isSaving}>
                                    <div class="sf-spinner sf-spinner-xs"></div>
                                    <span>Saving...</span>
                                </template>
                                <template if:false={isSaving}>{saveLabel}</template>
                            </button>
                        </div>
                    </div>
                </section>
            </template>

            <!-- ── IN-PERSON SIGNING MODAL ────────────────────────────── -->
            <template if:true={showInPersonModal}>
                <!-- Same explicit-close behavior as the Add/Edit modal above. -->
                <section class="sf-modal-backdrop">
                    <div class="sf-modal-dialog">
                        <header class="sf-modal-header">
                            <div class="sf-modal-icon-info">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                                    <line x1="8" y1="21" x2="16" y2="21"></line>
                                    <line x1="12" y1="17" x2="12" y2="21"></line>
                                </svg>
                            </div>
                            <div class="sf-modal-title-block">
                                <p class="sf-modal-eyebrow">IN-PERSON SIGNING</p>
                                <h3 class="sf-modal-title">Hand device to signer</h3>
                            </div>
                            <button class="sf-modal-close" onclick={handleCloseInPerson} title="Close">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </button>
                        </header>

                        <div class="sf-modal-body" style="text-align: center; padding: 32px 24px;">
                            <h4 style="font-size: 16px; font-weight: 700; color: var(--slate-900); margin: 0 0 8px;">Ready for {inPersonSignerName} to sign</h4>
                            <p style="font-size: 13px; color: var(--slate-600); line-height: 1.5; margin: 0 0 6px;">The signer will complete their signature directly on this device.
                            </p>
                            <p style="font-size: 11px; color: var(--slate-400); margin: 0;">Click the button below to open the secure signing viewport.</p>
                        </div>

                        <div class="sf-modal-footer" style="justify-content: center;">
                            <button class="sf-btn sf-btn-ghost" onclick={handleCloseInPerson}>Cancel</button>
                            <!-- A real anchor, not window.open: popup blockers never
                                 stop an anchor click, in any app or browser. -->
                            <a class="sf-btn sf-btn-primary" href={inPersonUrl} target="_blank"
                               rel="opener" onclick={handleOpenInPerson}>
                                Open Signing Page
                            </a>
                        </div>
                    </div>
                </section>
            </template>
        </div>

        <!-- Themed confirm/prompt, in place of the browser's native dialogs -->
        <c-signforce-confirm></c-signforce-confirm>
    </c-signforce-access-gate>
</template>
